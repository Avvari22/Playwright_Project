name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload Shard Raw Outputs (Blobs & Test Results)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: shard-outputs-${{ matrix.shard }}
        path: |
          blob-report/
          test-results/
          allure-results/
        retention-days: 7

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # 2. Update Node.js version here to 20 as well
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install dependencies
      run: npm ci

    - name: Download all shard outputs
      uses: actions/download-artifact@v4
      with:
        path: all-shard-inputs
        pattern: shard-outputs-*
        merge-multiple: true

    # This will now succeed without the Node.js warning
    - name: Merge blobs into HTML Report
      run: npx playwright merge-reports --reporter html ./all-shard-inputs

    - name: Generate Allure Report
      if: hashFiles('all-shard-inputs/allure-results/**') != ''
      run: |
        npm install -g allure-commandline
        allure generate ./all-shard-inputs/allure-results -o allure-report --clean

    - name: Upload Final Consolidated Reports
      uses: actions/upload-artifact@v4
      with:
        name: final-test-reports
        path: |
          playwright-report/
          allure-report/
        retention-days: 30