
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: |
          npx playwright test \
            tests/inventory.spec.ts \
            tests/navigate.spec.ts

      - name: Verify Allure Results
        if: always()
        run: |
          echo "Checking Allure result files"

          if [ ! -d "allure-results" ]; then
            echo "::error::allure-results directory missing"
            exit 1
          fi

          find allure-results -type f

          COUNT=$(find allure-results \
            -name '*-result.json' | wc -l)

          echo "Allure test results: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Allure test results generated"
            exit 1
          fi

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: |
          allure generate allure-results \
            --clean \
            -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy Allure Report
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
    # environment:
    #   name: github-pages

      - name: Display Allure Report URL
        if: github.event_name != 'pull_request'
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Allure Report URL: $REPORT_URL"

          echo "## Playwright Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Allure Report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Allure Report Link
        if: github.event_name != 'pull_request'
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Playwright Automation - Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Execution Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Allure Report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
